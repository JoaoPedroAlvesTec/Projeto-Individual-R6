<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard R6</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/sessao.js"></script>
  <script src="../js/alerta.js"></script>
</head>

<body onload="validarSessao(), carregarGraficoPergunta(1), carregarGraficoGeral(), carregarKpiTentativas(), carregarMaisEscolhidas(), carregarMenosEscolhidas()">

  <aside class="sidebar">
    <div class="profile">
      <img src="../assets/imgs/logo_png.png" alt="">
      <hr><br>
      <h3 id="h3_usuario" style="color:#00e0c6 ;"></h3>
    </div>

    <nav class="menu">
      <div class="navegacao">
        <img src="../assets/icon/quiz.png" class="icons">
        <a href="quiz.html">QUIZ</a>
      </div>

      <div class="navegacao">
        <img src="../assets/icon/ranking.png" class="icons">
        <a href="dashboard.html">RANKING</a>
      </div>

      <div class="navegacao active">
        <img src="../assets/icon/news.png" class="icons">
        <a href="noticias.html">NOTÍCIAS</a>
      </div>
      <div class="navegacao active">
        <img src="../assets/icon/chat.png" class="icons">
        <a href="chat.html">BATE PAPO</a>
      </div>
    </nav>

    <div class="logout">
      <button id="btn_sair" onclick="limparSessao()">Sair</button>
    </div>
  </aside>

  <main class="main">

    <div class="top">
      <h1>DASHBOARD</h1>
      <p>Veja as escolhas mais populares do quiz</p>
    </div>

    <div class="filtro">
      <select id="selectPergunta">
        <option value="1">Pergunta 1</option>
        <option value="2">Pergunta 2</option>
        <option value="3">Pergunta 3</option>
        <option value="4">Pergunta 4</option>
        <option value="5">Pergunta 5</option>
        <option value="6">Pergunta 6</option>
        <option value="7">Pergunta 7</option>
        <option value="8">Pergunta 8</option>
        <option value="9">Pergunta 9</option>
        <option value="10">Pergunta 10</option>
      </select>

      <button class="btn" onclick="filtrarPergunta()">Confirmar</button>
    </div>

    <div class="graficos">


  <div class="kpis">

    <div class="kpi">
      <h2>Pessoas que Responderam ao quiz</h2>
      <span id="kpiTentativasTotal"></span>
      <p id="kpiTotal">Respostas ao quiz</p>
    </div>

    <div class="kpi">
      <h2>Alternativa Mais Popular</h2>
      <span id="kpiMaisEscolhida"></span>
      <p id="kpiMaisEscolhidaPergunta"></p>
    </div>

    <div class="kpi">
      <h2>Alternativa Menos Popular</h2>
      <span id="kpiMenosEscolhida"> </span>
      <p id="kpiMenosEscolhidaPergunta"></p>
    </div>

  </div>

  <div class="grafico topo">
    <h3>Alternativa mais escolhida da pergunta</h3>
    <canvas id="graficoPergunta"></canvas>
  </div>

  <div class="grafico baixo">
    <h3>Alternativas mais escolhidas</h3>
    <canvas id="graficoGeral"></canvas>
  </div>

</div>

  </main>

</body>

</html>
<script>
  h3_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  let graficoPergunta;

  function filtrarPergunta() {

    const idPergunta = document.getElementById("selectPergunta").value;

    console.log("Filtrando pergunta:", idPergunta);

    carregarGraficoPergunta(idPergunta);
  }

  function carregarGraficoPergunta(idPergunta) {

    fetch(`/graficos/estatisticas/${idPergunta}`)
      .then(res => res.json())
      .then(data => {

        let labels = [];
        let valores = [];

        data.forEach(item => {
          labels.push(item.alternativa);
          valores.push(item.total);
        });

        renderizarGraficoPergunta(labels, valores);

      })
      .catch(err => console.error(err));
  }

  function renderizarGraficoPergunta(labels, valores) {

    const ctx = document.getElementById("graficoPergunta");

    if (graficoPergunta) {
      graficoPergunta.destroy();
    }

    graficoPergunta = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: valores,
          backgroundColor: [
            "#003366",
            "#007BFF",
            "#00FFFF",
            "#87CEEB",
            "#E0F7FA"
          ],
          borderColor: "#0e131a",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "bottom",
            labels: {
              color: "#fff",
              padding: 15,
              boxWidth: 15
            }
          }
        }
      }
    });
  }

  let graficoGeral;

  function carregarGraficoGeral() {

    fetch(`/graficos/estatisticas-geral`)
      .then(res => res.json())
      .then(data => {

        let labels = [];
        let valores = [];

        data.forEach(item => {
          labels.push(`P${item.id_pergunta} - ${item.alternativa}`);
          valores.push(item.total);
        });

        renderizarGraficoGeral(labels, valores);

      })
      .catch(err => console.error(err));
  }

  function carregarKpiTentativas() {

    fetch(`/graficos/tentativasTotal`)
      .then(res => res.json())
      .then(data => {

        kpiTentativasTotal.innerHTML = data[0].tentativas;

      })
      .catch(err => console.error(err));
  }

  function carregarMaisEscolhidas() {

    fetch(`/graficos/maisEscolhida`)
      .then(res => res.json())
      .then(data => {

        kpiMaisEscolhida.innerHTML = data[0].alternativa;
        kpiMaisEscolhidaPergunta.innerHTML = `Pergunta ${data[0].id_pergunta}`;

      })
      .catch(err => console.error(err));
  }



  function carregarMenosEscolhidas() {

    fetch(`/graficos/menosEscolhida`)
      .then(res => res.json())
      .then(data => {

        kpiMenosEscolhida.innerHTML = data[0].alternativa;
        kpiMenosEscolhidaPergunta.innerHTML = `Pergunta ${data[0].id_pergunta}`;

      })
      .catch(err => console.error(err));
  }

  function renderizarGraficoGeral(labels, valores) {

    const ctx = document.getElementById("graficoGeral");

    if (graficoGeral) {
      graficoGeral.destroy();
    }
    const cores = [
      "#ff9d00",
      "#00ffff"
    ];
    graficoGeral = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: "Mais escolhidos por pergunta",
          data: valores,
          backgroundColor: cores
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: "#fff" }
          }
        },
        scales: {
          x: {
            ticks: { color: "#aaa" }
          },
          y: {
            ticks: { color: "#aaa" },
            beginAtZero: true,
            stepSize: 1
          }
        }
      }
    });
  }

  function atualizarGrafico() {
    let idPergunta = document.getElementById("selectPergunta").value;
    carregarGraficoPergunta(idPergunta);
  }
</script>

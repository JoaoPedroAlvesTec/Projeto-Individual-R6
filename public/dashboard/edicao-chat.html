<head>

        rel="stylesheet">
</head>

<body onload=" listarInfosDeUm()" style="background-color: #161618;">
    <!-- <body onload="validarSessao()"> -->

    <aside class="sidebar">
        <div class="profile">
            <img src="../assets/imgs/logo_png.png" alt="">
            <hr><br>
            <h3 id="h3_usuario" style="color:#00e0c6 ;"></h3>
        </div>

        <nav class="menu">
            <div class="navegacao">
                <img src="../assets/icon/quiz.png" class="icons">
                <a href="quiz.html">QUIZ</a>
            </div>

            <div class="navegacao">
                <img src="../assets/icon/ranking.png" class="icons">
                <a href="dashboard.html">RANKING</a>
            </div>

            <div class="navegacao active">
                <img src="../assets/icon/news.png" class="icons">
                <a href="noticias.html">NOTÍCIAS</a>
            </div>
            <div class="navegacao active">
                <img src="../assets/icon/chat.png" class="icons">
                <a href="chat.html">BATE PAPO</a>
            </div>
        </nav>

        <div class="logout">
            <button id="btn_sair" onclick="limparSessao()">Sair</button>
        </div>
    </aside>

    <div class="dash-right-edicao-avsio">

        <div class="avisos">
            <div class="container-edicao-aviso">
                <h1>Editar um aviso</h1>
                <div class="div-form-edicao-aviso">
                    <label>
                        ID:
                        <br>
                        <input id="input_id" maxlength="100" type="text" style="color: rgb(196, 196, 196)" disabled>
                    </label>
                    <label>
                        Autor:
                        <br>
                        <input id="input_nome" maxlength="100" type="text" style="color: rgb(196, 196, 196)" disabled>
                    </label>
                    <label>
                        Título:
                        <br>
                        <input id="input_titulo" maxlength="100" type="text" style="color: rgb(196, 196, 196)" disabled>
                    </label>
                    <br>
                    <label>
                        Descrição (máximo de 250 caracteres):
                        <br>
                        <textarea id="textarea_descricao" maxlength="250" rows="5"></textarea>
                    </label>
                    <br>
                    <button onclick="editar()">Editar</button>
                </div>

            </div>
        </div>
    </div>
    </div>
</body>

</html>

<script>
    function listarInfosDeUm() {
        console.log("Criar função de trazer informações de post escolhido");
    }

    function editar() {
        fetch(`/chat/editar/${sessionStorage.getItem("ID_POSTAGEM_EDITANDO")}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                descricao: textarea_descricao.value
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                window.alert("Post atualizado com sucesso pelo usuario de email: " + sessionStorage.getItem("EMAIL_USUARIO") + "!");
                window.location = "/dashboard/chat.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }

</script>
